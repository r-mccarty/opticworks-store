name = "opticworks-api-cors"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Observability - enable Workers logs
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Development variables (pointing to medusa backend via tunnel)
[vars]
MEDUSA_ORIGIN = "https://medusa.optic.works"
ALLOWED_ORIGINS = "https://optic.works,https://www.optic.works,http://localhost:3000"

# Production environment - ROUTES REMOVED
# api.optic.works now goes directly to Cloudflare Tunnel (Medusa handles CORS)
# This worker is kept for backwards compatibility but has no routes
[env.production]
name = "opticworks-api-cors"
# Routes removed - api.optic.works now served by Cloudflare Tunnel directly
# routes = [
#   { pattern = "api.optic.works/*", zone_name = "optic.works" }
# ]

[env.production.vars]
MEDUSA_ORIGIN = "https://medusa.optic.works"
ALLOWED_ORIGINS = "https://optic.works,https://www.optic.works,https://api.optic.works"
