---
# OpticWorks Medusa Backend - Code Deployment Only
# Use this for deploying code updates without reprovisioning infrastructure

- name: Deploy Medusa Application Updates
  hosts: medusa_backend
  gather_facts: yes
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/secrets.yml

  tasks:
    - name: Clone repository to temp location
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "/tmp/medusa-deploy"
        version: "{{ repo_branch }}"
        force: yes
      become: yes
      become_user: "{{ app_user }}"

    - name: Sync backend directory to app root
      ansible.posix.synchronize:
        src: "/tmp/medusa-deploy/backend/"
        dest: "{{ app_root }}/"
        delete: yes
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=.medusa"
          - "--exclude=logs"
          - "--exclude=public"
          - "--exclude=.env"
      delegate_to: "{{ inventory_hostname }}"
      become: yes
      become_user: "{{ app_user }}"

    - name: Clean up temp clone
      ansible.builtin.file:
        path: "/tmp/medusa-deploy"
        state: absent
      become: yes

    - name: Update .env file from template
      ansible.builtin.template:
        src: ../roles/medusa/templates/medusa.env.j2
        dest: "{{ medusa_service_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0600'
      become: yes

    - name: Install/update pnpm dependencies
      ansible.builtin.command:
        cmd: pnpm install --ignore-workspace
        chdir: "{{ medusa_service_dir }}"
      become: yes
      become_user: "{{ app_user }}"
      changed_when: false

    - name: Rebuild Medusa admin dashboard
      ansible.builtin.command:
        cmd: pnpm run build
        chdir: "{{ medusa_service_dir }}"
      become: yes
      become_user: "{{ app_user }}"
      register: build_output

    - name: Check current PM2 processes
      ansible.builtin.command:
        cmd: pm2 jlist
      become: yes
      become_user: "{{ app_user }}"
      register: pm2_current
      changed_when: false
      failed_when: false

    - name: Parse PM2 process list
      ansible.builtin.set_fact:
        pm2_processes: "{{ pm2_current.stdout | default('[]') | from_json }}"

    - name: Verify expected process is running
      ansible.builtin.assert:
        that:
          - pm2_processes | selectattr('name', 'equalto', pm2_app_name) | list | length > 0
        fail_msg: |
          ERROR: Expected PM2 process '{{ pm2_app_name }}' not found!
          Running processes: {{ pm2_processes | map(attribute='name') | list }}
          This indicates drift. Run medusa-provision.yml to fix.
        success_msg: "Found process '{{ pm2_app_name }}' - proceeding with restart"

    - name: Stop existing process cleanly
      ansible.builtin.command:
        cmd: "pm2 delete {{ pm2_app_name }}"
      become: yes
      become_user: "{{ app_user }}"
      changed_when: true

    - name: Start fresh from ecosystem config
      ansible.builtin.command:
        cmd: pm2 start ecosystem.config.js --env production
        chdir: "{{ medusa_service_dir }}"
      environment:
        PM2_TARGET: "production"
      become: yes
      become_user: "{{ app_user }}"
      changed_when: true

    - name: Save PM2 process list
      ansible.builtin.command:
        cmd: pm2 save
      become: yes
      become_user: "{{ app_user }}"
      changed_when: false

    - name: Wait for Medusa to restart
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ medusa_port }}"
        delay: 3
        timeout: 30
        state: started

    - name: Verify Medusa health
      ansible.builtin.uri:
        url: "http://localhost:{{ medusa_port }}/health"
        method: GET
        status_code: 200
      retries: 3
      delay: 2
      until: health_check.status == 200
      register: health_check

    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "✅ Medusa application deployed successfully!"
          - ""
          - "Git commit: {{ ansible_local.git.commit | default('latest') }}"
          - "Service status: {{ health_check.status }}"
          - ""
          - "Access URLs:"
          - "  - Health: http://localhost:{{ medusa_port }}/health"
          - "  - Admin:  {{ medusa_backend_url }}{{ medusa_admin_path }}"
