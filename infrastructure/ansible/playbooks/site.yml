# Full converge of the backend host. Run via scripts/run.py, never directly:
# it injects secrets, the release archive and the ephemeral SSH key.
- name: OpticWorks backend
  hosts: backend
  become: true
  gather_facts: true
  pre_tasks:
    - name: Required inputs are present (names only)
      ansible.builtin.assert:
        that: lookup('env', item) | length > 0
        fail_msg: "Missing required input {{ item }}"
        quiet: true
      loop:
        - DATABASE_URL_POOLED
        - DATABASE_URL_DIRECT
        - JWT_SECRET
        - COOKIE_SECRET
        - REDIS_APP_PASSWORD
        - REDIS_BACKUP_PASSWORD
        - RESTIC_PASSWORD
        - STRIPE_SECRET_KEY
        - STRIPE_WEBHOOK_SECRET
        - EASYPOST_API_KEY
        - RESEND_API_KEY
        - RESEND_FROM_EMAIL
        - S3_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY
        - S3_API_ENDPOINT
        - TIGRIS_ACCESS_KEY_ID
        - TIGRIS_SECRET_ACCESS_KEY
        - CLOUDFLARE_TUNNEL_TOKEN
        - RELEASE_SHA
        - RELEASE_ARCHIVE
  roles:
    - base
    - redis
    - nodejs
    - medusa
    - cloudflared
    - backup
