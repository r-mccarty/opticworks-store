---
# Node.js and pnpm Installation

- name: Install Node.js prerequisites
  become: yes
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

- name: Add NodeSource GPG key
  become: yes
  ansible.builtin.apt_key:
    url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    state: present

- name: Add NodeSource repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "deb https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js
  become: yes
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: yes

- name: Install pnpm globally
  become: yes
  ansible.builtin.npm:
    name: pnpm
    global: yes
    version: "{{ pnpm_version }}"
    state: present

- name: Verify Node.js installation
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false

- name: Verify pnpm installation
  ansible.builtin.command: pnpm --version
  register: pnpm_version_check
  changed_when: false

- name: Display Node.js version
  ansible.builtin.debug:
    msg: "Node.js {{ node_version.stdout }} installed"

- name: Display pnpm version
  ansible.builtin.debug:
    msg: "pnpm {{ pnpm_version_check.stdout }} installed"
