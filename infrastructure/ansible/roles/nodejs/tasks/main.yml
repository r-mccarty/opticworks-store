- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: NodeSource signing key (dearmored)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg.new
    mv /etc/apt/keyrings/nodesource.gpg.new /etc/apt/keyrings/nodesource.gpg
    chmod 0644 /etc/apt/keyrings/nodesource.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/nodesource.gpg

- name: NodeSource repository (Node {{ node_major }}.x, signed-by its key only)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ node_major }}.x
      Suites: nodistro
      Components: main
      Signed-By: /etc/apt/keyrings/nodesource.gpg
  register: nodejs_repo

- name: Prefer NodeSource for nodejs over Debian's older package
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodejs
    mode: "0644"
    content: |
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: "{{ nodejs_repo is changed }}"

- name: Node.js is the expected major version
  ansible.builtin.command: node --version
  register: nodejs_version
  changed_when: false
  failed_when: not nodejs_version.stdout.startswith('v' ~ node_major ~ '.')

- name: Enable corepack and pin pnpm {{ pnpm_version }}
  ansible.builtin.shell: |
    set -e
    corepack enable
    COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack prepare pnpm@{{ pnpm_version }} --activate
    pnpm --version
  register: nodejs_pnpm
  changed_when: false
  failed_when: nodejs_pnpm.stdout_lines[-1] != pnpm_version
