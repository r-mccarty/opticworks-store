---
# Node.js and pnpm Installation

- name: Install Node.js prerequisites
  become: yes
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

- name: Create keyring directory
  become: yes
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download NodeSource GPG key
  become: yes
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    dest: /etc/apt/keyrings/nodesource.asc
    mode: '0644'

- name: Add NodeSource repository
  become: yes
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js
  become: yes
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: yes

- name: Check if pnpm is installed
  ansible.builtin.command: pnpm --version
  register: pnpm_check
  failed_when: false
  changed_when: false

- name: Install pnpm globally
  become: yes
  ansible.builtin.npm:
    name: pnpm
    global: yes
    version: "{{ pnpm_version }}"
    state: present
  when: pnpm_check.rc != 0

- name: Verify Node.js installation
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false

- name: Verify pnpm installation
  ansible.builtin.command: pnpm --version
  register: pnpm_version_check
  changed_when: false

- name: Display Node.js version
  ansible.builtin.debug:
    msg: "Node.js {{ node_version.stdout }} installed"

- name: Display pnpm version
  ansible.builtin.debug:
    msg: "pnpm {{ pnpm_version_check.stdout }} installed"
