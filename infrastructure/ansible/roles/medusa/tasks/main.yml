---
# Medusa Application Deployment

- name: Install Git
  become: yes
  ansible.builtin.apt:
    name: git
    state: present

- name: Ensure app root directory exists
  become: yes
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Clone repository to temp location
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "/tmp/medusa-clone"
    version: "{{ repo_branch }}"
    force: yes
  become: yes
  become_user: "{{ app_user }}"

- name: Sync backend directory to app root
  ansible.posix.synchronize:
    src: "/tmp/medusa-clone/backend/"
    dest: "{{ app_root }}/"
    delete: yes
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.medusa"
      - "--exclude=logs"
  delegate_to: "{{ inventory_hostname }}"
  become: yes
  become_user: "{{ app_user }}"

- name: Clean up temp clone
  ansible.builtin.file:
    path: "/tmp/medusa-clone"
    state: absent
  become: yes

- name: Create Medusa .env file
  ansible.builtin.template:
    src: medusa.env.j2
    dest: "{{ medusa_service_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  become: yes

- name: Install Medusa dependencies (standalone, not workspace)
  ansible.builtin.command:
    cmd: pnpm install --ignore-workspace
    chdir: "{{ medusa_service_dir }}"
  become: yes
  become_user: "{{ app_user }}"
  changed_when: false

- name: Verify Medusa CLI is available
  ansible.builtin.command:
    cmd: pnpm exec medusa --version
    chdir: "{{ medusa_service_dir }}"
  become: yes
  become_user: "{{ app_user }}"
  register: medusa_version
  changed_when: false

- name: Build Medusa backend for production
  ansible.builtin.command:
    cmd: pnpm exec medusa build
    chdir: "{{ medusa_service_dir }}"
  become: yes
  become_user: "{{ app_user }}"
  environment:
    NODE_ENV: production
  register: medusa_build
  failed_when: "'Backend build completed successfully' not in medusa_build.stdout"
  changed_when: "'Backend build completed successfully' in medusa_build.stdout"

# CRITICAL: Medusa looks for admin at ./public/admin but builds to .medusa/server/public/admin
# This symlink bridges that gap for production mode
- name: Ensure public directory exists
  ansible.builtin.file:
    path: "{{ medusa_service_dir }}/public"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: yes

- name: Create public/admin symlink for production admin UI
  ansible.builtin.file:
    src: "{{ medusa_service_dir }}/.medusa/server/public/admin"
    dest: "{{ medusa_service_dir }}/public/admin"
    state: link
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  become: yes
  become_user: "{{ app_user }}"

- name: Install PM2 globally
  become: yes
  ansible.builtin.npm:
    name: pm2
    global: yes
    state: present

- name: Stop any existing Medusa PM2 processes
  ansible.builtin.command:
    cmd: pm2 delete all
  become: yes
  become_user: "{{ app_user }}"
  failed_when: false
  changed_when: false

- name: Start Medusa with PM2 (production mode)
  ansible.builtin.command:
    cmd: "pm2 start ecosystem.config.js --env production"
    chdir: "{{ medusa_service_dir }}"
  environment:
    PM2_TARGET: "production"
  become: yes
  become_user: "{{ app_user }}"
  register: pm2_start
  changed_when: "'launched' in pm2_start.stdout or 'online' in pm2_start.stdout"

# Drift detection: verify process name matches Ansible configuration
- name: Get PM2 process list (JSON)
  ansible.builtin.command:
    cmd: pm2 jlist
  become: yes
  become_user: "{{ app_user }}"
  register: pm2_list
  changed_when: false

- name: Parse running process names
  ansible.builtin.set_fact:
    running_pm2_processes: "{{ pm2_list.stdout | from_json | map(attribute='name') | list }}"

- name: Verify expected process is running (drift check)
  ansible.builtin.assert:
    that:
      - pm2_app_name in running_pm2_processes
    fail_msg: |
      DRIFT DETECTED: Expected process '{{ pm2_app_name }}' not found!
      Running processes: {{ running_pm2_processes }}
      Check that ecosystem.config.js process name matches pm2_app_name in group_vars/all.yml
    success_msg: "✓ Process '{{ pm2_app_name }}' is running as expected"

- name: Warn if unexpected processes are running
  ansible.builtin.debug:
    msg: |
      WARNING: Found unexpected PM2 processes: {{ running_pm2_processes | difference([pm2_app_name]) }}
      Consider investigating these for potential drift.
  when: running_pm2_processes | length > 1

- name: Save PM2 process list
  ansible.builtin.command:
    cmd: pm2 save
  become: yes
  become_user: "{{ app_user }}"
  changed_when: false

- name: Setup PM2 startup script
  ansible.builtin.command:
    cmd: pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
  become: yes
  register: pm2_startup
  changed_when: "'successfully' in pm2_startup.stdout"

- name: Wait for Medusa to start
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ medusa_port }}"
    delay: 5
    timeout: 60
    state: started

- name: Verify Medusa health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ medusa_port }}/health"
    method: GET
    status_code: 200
  register: health_check
  retries: 5
  delay: 3
  until: health_check.status == 200
