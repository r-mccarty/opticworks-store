# Deploys the backend as two hardened systemd services (API server and
# background worker) from an immutable release directory, runs migrations
# against Neon's direct endpoint, health-checks and rolls back on failure.

- name: App system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    home: "{{ app_root }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: App directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ app_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ app_root }}", owner: "{{ app_user }}", mode: "0750" }
    - { path: "{{ app_root }}/releases", owner: "{{ app_user }}", mode: "0750" }
    - { path: "{{ app_root }}/.cache", owner: "{{ app_user }}", mode: "0700" }
    # Medusa's telemetry config store writes here even with telemetry disabled.
    - { path: "{{ app_root }}/.config", owner: "{{ app_user }}", mode: "0700" }
    # 0751: other service users (cloudflared, backups) may traverse but not list.
    - { path: "{{ app_env_dir }}", owner: root, mode: "0751" }

- name: Secrets are safe to place in a systemd/sh environment file
  ansible.builtin.assert:
    that: "medusa_env | dict2items | rejectattr('value', 'match', '^[^\"\\\\$`\\n]*$') | list | length == 0"
    fail_msg: "An environment value contains a quote, backslash, $ or backtick"
    quiet: true
  no_log: true

- name: Runtime environment (root:medusa 0640)
  ansible.builtin.template:
    src: medusa.env.j2
    dest: "{{ app_env_dir }}/medusa.env"
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  no_log: true
  register: medusa_envfile

- name: systemd units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    mode: "0644"
  loop: [medusa-server, medusa-worker]
  register: medusa_units

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: medusa_units is changed

# ---- Release ---------------------------------------------------------------

- name: Release id
  ansible.builtin.set_fact:
    medusa_release: "{{ lookup('env', 'RELEASE_SHA') }}"
    medusa_release_dir: "{{ app_root }}/releases/{{ lookup('env', 'RELEASE_SHA') }}"

- name: Release id is a commit sha
  ansible.builtin.assert:
    that: medusa_release is match('^[0-9a-f]{12,40}$')

- name: Check for an existing build of this release
  ansible.builtin.stat:
    path: "{{ medusa_release_dir }}/.medusa/server/node_modules"
  register: medusa_built

- name: Unpack release source
  when: not medusa_built.stat.exists
  block:
    - name: Release directory
      ansible.builtin.file:
        path: "{{ medusa_release_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"

    - name: Copy and extract source archive
      ansible.builtin.unarchive:
        src: "{{ lookup('env', 'RELEASE_ARCHIVE') }}"
        dest: "{{ medusa_release_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        extra_opts: [--strip-components=1]

    - name: Install, build and install production dependencies
      become_user: "{{ app_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        set -a; . {{ app_env_dir }}/medusa.env; set +a
        export HOME={{ app_root }} COREPACK_HOME={{ app_root }}/.cache/corepack COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        export MEDUSA_DISABLE_TELEMETRY=true NODE_OPTIONS=--max-old-space-size=1536
        pnpm install --frozen-lockfile --ignore-workspace
        pnpm build
        cp pnpm-lock.yaml .medusa/server/
        cd .medusa/server
        pnpm install --prod --frozen-lockfile --ignore-workspace
      args:
        chdir: "{{ medusa_release_dir }}"
        executable: /bin/bash
      environment:
        CI: "true"

- name: Run database migrations (Neon direct endpoint)
  become_user: "{{ app_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    set -a; . {{ app_env_dir }}/medusa.env; set +a
    export DATABASE_URL="$MIGRATE_DATABASE_URL" HOME={{ app_root }} MEDUSA_DISABLE_TELEMETRY=true
    ./node_modules/.bin/medusa db:migrate
  args:
    chdir: "{{ medusa_release_dir }}/.medusa/server"
    executable: /bin/bash
  environment:
    MIGRATE_DATABASE_URL: "{{ lookup('env', 'DATABASE_URL_DIRECT') }}"
  no_log: true
  register: medusa_migrate
  changed_when: "'Migrations completed' in medusa_migrate.stdout or 'Running migrations' in medusa_migrate.stdout"

- name: Remember the release currently live
  ansible.builtin.stat:
    path: "{{ app_root }}/current"
  register: medusa_previous

- name: Point current at this release
  ansible.builtin.file:
    src: "{{ medusa_release_dir }}"
    dest: "{{ app_root }}/current"
    state: link
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    force: true
  register: medusa_switch

# A crash loop from an earlier failed release trips StartLimitBurst; clear it so
# this release gets a fresh start.
- name: Clear any start-limit state
  ansible.builtin.command: systemctl reset-failed medusa-server medusa-worker
  changed_when: false
  failed_when: false

# Starting is inside the block so a release that can't even start is rolled back too.
- name: Start and health-check the release
  block:
    - name: Restart services when release, environment or units changed
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: [medusa-server, medusa-worker]
      when: medusa_switch is changed or medusa_envfile is changed or medusa_units is changed

    - name: Services enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [medusa-server, medusa-worker]

    - name: API server is healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ medusa_server_port }}/health"
      register: medusa_health
      until: medusa_health.status == 200
      retries: 40
      delay: 3

    - name: Worker is running
      ansible.builtin.command: systemctl is-active medusa-worker
      changed_when: false
  rescue:
    - name: Roll back to the previous release
      ansible.builtin.file:
        src: "{{ medusa_previous.stat.lnk_source }}"
        dest: "{{ app_root }}/current"
        state: link
        force: true
      when: medusa_previous.stat.islnk | default(false)

    - name: Restart services on the previous release
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: [medusa-server, medusa-worker]
      when: medusa_previous.stat.islnk | default(false)

    - name: Stop the services when there is no previous release to fall back to
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: [medusa-server, medusa-worker]
      when: not (medusa_previous.stat.islnk | default(false))

    - name: Fail the deploy
      ansible.builtin.fail:
        msg: "Release {{ medusa_release }} failed to start or pass its health check; {{ 'rolled back' if medusa_previous.stat.islnk | default(false) else 'no previous release, services stopped' }}. See journalctl -u medusa-server -u medusa-worker"

- name: Keep the three most recent releases
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ app_root }}/releases
    live=$(basename "$(readlink -f {{ app_root }}/current)")
    ls -1t | grep -vx "$live" | tail -n +3 | xargs -r rm -rf --
  args:
    executable: /bin/bash
  changed_when: false
