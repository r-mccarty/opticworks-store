# Remotely-managed tunnel (ingress is set via the Cloudflare API by
# scripts/cloudflare_setup.py). The token lives in a root-only env file.

- name: Cloudflare package signing key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"

- name: cloudflared repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cloudflared.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://pkg.cloudflare.com/cloudflared
      Suites: any
      Components: main
      Signed-By: /usr/share/keyrings/cloudflare-main.gpg
  register: cloudflared_repo

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: latest
    update_cache: "{{ cloudflared_repo is changed }}"
  notify: Restart cloudflared

- name: cloudflared system user
  ansible.builtin.user:
    name: cloudflared
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Tunnel token (root:cloudflared 0640)
  ansible.builtin.copy:
    dest: "{{ app_env_dir }}/cloudflared.env"
    owner: root
    group: cloudflared
    mode: "0640"
    content: "TUNNEL_TOKEN={{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') }}\n"
  no_log: true
  notify: Restart cloudflared

- name: cloudflared unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    mode: "0644"
  notify: Restart cloudflared

- name: cloudflared enabled
  ansible.builtin.systemd:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true
