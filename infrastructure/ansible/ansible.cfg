[defaults]
inventory = inventory/production.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
interpreter_python = /usr/bin/python3
# Secrets are injected as environment variables; never write them to logs.
no_log = False
display_skipped_hosts = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
