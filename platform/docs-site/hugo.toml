baseURL = "https://docs.opticworks.com/"
languageCode = "en-us"
title = "OpticWorks Documentation"
theme = "geekdoc"

[params]
  description = "Presence Intelligence Platform – developer + installer documentation"
  geekdocRepo = "https://github.com/r-mccarty/opticworks-store"
  geekdocEditPath = "edit/main/docs"
  geekdocSearch = true
  geekdocPrevious = true
  geekdocNext = true

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.mounts]]
    source = "../../docs"
    target = "content/docs"
