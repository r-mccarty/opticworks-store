{{ if .Site.Params.search.enabled }}
<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search documentation">
  <div class="search-modal__container">
    <div class="search-modal__header">
      <svg class="search-modal__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        class="search-modal__input"
        id="search-input"
        placeholder="Search documentation..."
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <kbd class="search-modal__kbd">Esc</kbd>
    </div>

    <div class="search-modal__results" id="search-results">
      <div class="search-modal__empty">
        Type to search...
      </div>
    </div>

    <div class="search-modal__footer">
      <div class="search-modal__hint">
        <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span><kbd>↵</kbd> Select</span>
        <span><kbd>Esc</kbd> Close</span>
      </div>
    </div>
  </div>
</div>
{{ end }}
