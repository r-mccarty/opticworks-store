version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: discourse
      POSTGRES_DB: discourse
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  discourse:
    image: discourse/discourse:3.3.0.beta3
    depends_on:
      - postgres
      - redis
    ports:
      - "8085:80"
    environment:
      DISCOURSE_HOSTNAME: localhost
      DISCOURSE_DEVELOPER_EMAILS: dev@opticworks.com
      DISCOURSE_SMTP_ADDRESS: smtp.example.com
      DISCOURSE_SMTP_PORT: 587
      DISCOURSE_SMTP_USER_NAME: smtp-user
      DISCOURSE_SMTP_PASSWORD: smtp-pass
      DISCOURSE_DB_HOST: postgres
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: discourse
      DISCOURSE_REDIS_HOST: redis
    volumes:
      - discourse-data:/bitnami/discourse
      - ./theme:/var/www/discourse/plugins/opticworks-theme

volumes:
  postgres-data:
  redis-data:
  discourse-data:
